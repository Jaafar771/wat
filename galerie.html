<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galerie – WAT Mariahilf Tischtennis</title>
  
  <link rel="icon" type="image/png" sizes="150x150" href="imgs/favlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Externe Style.css einbinden -->
  <link rel="stylesheet" href="style.css">

 
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar-wrapper">
  <div id="navbar-placeholder"></div>
  </header>

  <!-- Hero Bereich -->
  <section class="hero-section">
    <div class="container">
      <a href="index.html" class="btn-outline" style="margin-bottom: 14px;">← Hauptseite</a>
      <br>
      <div class="hero-badge">EINDRÜCKE & MOMENTE</div>
      <h1 class="hero-title">FOTO<span class="text-stroke">GALERIE</span></h1>
    </div>
  </section>

  <!-- Galerie Grid -->
  <section class="gallery-section">
    <div class="container">
      <div class="gallery-grid">
        
        <!-- Bild 1 -->
        <div class="gallery-item animate-on-scroll">
          <img src="imgs/kinder.jpg" alt="Jugendtraining Tischtennis" class="gallery-img">
          <div class="gallery-caption">Jugendtraining in der Liniengasse</div>
        </div>

        <!-- Bild 2 -->
        <div class="gallery-item animate-on-scroll">
          <img src="imgs/Hobby.jpg" alt="Hobbyspieler" class="gallery-img">
          <div class="gallery-caption">Hobbygruppe & Freizeitspiel</div>
        </div>

        <!-- Bild 3 -->
        <div class="gallery-item animate-on-scroll">
          <img src="imgs/senioren.jpg" alt="Senioren Training" class="gallery-img">
          <div class="gallery-caption">Senioren-Training</div>
        </div>

        <!-- Platzhalter für weitere Bilder (einfach duplizieren und anpassen) -->
        <div class="gallery-item animate-on-scroll">
          <img src="imgs/jungs.jpg" alt="Vereinshalle" class="gallery-img">
          <div class="gallery-caption">Unsere Spieler</div>
        </div>

      </div>
    </div>
  </section>

  <!-- Automatischer Footer Placeholder -->
  <div id="footer-placeholder"></div>

 <script src="script.js"></script>
 <button id="backToTop" class="back-to-top" aria-label="Nach oben scrollen">↑</button>

</body>
</html>
