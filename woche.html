<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meisterschafts-Wochenübersicht – WAT Mariahilf</title>
  
  <link rel="icon" type="image/png" sizes="400x400" href="imgs/favlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar-wrapper">
    <div id="navbar-placeholder"></div>
  </header>

  <!-- Hero Bereich -->
  <section class="hero-section">
    <div class="container">
      <a href="index.html" class="btn-outline" style="margin-bottom: 14px;">← Hauptseite</a>
      <div class="hero-badge">SAISON 2026</div>
      <h1 class="hero-title">SPIEL<span class="text-stroke">PLAN</span></h1>
      <p class="hero-subtitle">Interaktive Wochenübersicht aller Meisterschaftsspiele.</p>
    </div>
  </section>

<!-- Spielplan Sektion mit Steuerung und modernem Layout -->
<section class="section">
  <div class="container">
    
    <!-- Steuerungsleiste (Woche vor/zurück, Heute, Filter) -->
    <div class="controls-bar">
      <div class="nav-btns">
        <button class="btn" id="prevWeek">← Vorige</button>
        <button class="btn" id="todayWeek">Heute</button>
        <button class="btn" id="nextWeek">Nächste →</button>
      </div>
      <div class="current-week-title" id="weekDisplay">Woche --</div>
      <input type="text" class="search-input" id="filterInput" placeholder="Team filtern (z.B. MAR1)...">
    </div>

    <!-- Hier werden die Tage als moderne Karten für Handy und PC gerendert -->
    <div class="week-grid" id="weekGrid"></div>

  </div>
</section>

  <!-- Container für den dynamischen Footer -->
  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <button id="backToTop" class="back-to-top" aria-label="Nach oben scrollen">↑</button>

</body>
</html>
